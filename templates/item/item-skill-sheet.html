<section class="{{cssClass}}" autocomplete="off">

	<div class="grid grid-2col">
		<div class="resource">
			<label class="resource-label">{{ localize "SPACE1889.Level" }}</label>
			<input type="text" name="system.level" value="{{system.level}}" data-dtype="Number" />
		</div>
		<div class="resource">
			<label class="resource-label">{{ localize "SPACE1889.Rating" }}</label>
			<div class="resource-content flexrow flex-between">
				<div class="resource item-margin5px">{{system.rating}}</div>
			</div>
		</div>
	</div>
	<div class="grid grid-2col">
		<div class="resource">
			<label class="resource-label">{{ localize "SPACE1889.SkillGroup" }}</label>
			<div>
				<input type="checkbox" name="system.isSkillGroup" {{checked system.isSkillGroup}} />
			</div>
		</div>
		<div class="resource">
			<label class="resource-label">{{ localize "SPACE1889.Name" }}</label>
			<select name="system.skillGroupName">
				{{selectOptions system.skillGroups selected=system.skillGroupName localize=true}}
			</select>
		</div>

		<div class="resource">
			<label class="resource-label">{{ localize "SPACE1889.BaseAbility" }}</label>
			<div>
				<select name="system.underlyingAttribute" data-dtype="String">
					{{selectOptions system.abilities selected=system.underlyingAttribute localize=true}}
				</select>
			</div>
		</div>
		<div class="resource">
			<label class="resource-label">{{ localize "SPACE1889.Publication" }}</label>
			<select name="system.source.publication" data-dtype="String">
				{{selectOptions system.publications selected=system.source.publication localize=true}}
			</select>
		</div>
	</div>
	
	<hr>
	<div>
		<li class="item flexrow items-header">
			<label class="resource-label">{{ localize "SPACE1889.IsCampaingnEffect"}}</label>
			<label class="resource-label">{{ localize "SPACE1889.Source"}}</label>
		</li>
		<li class="item flex-group-center flexrow">
			<div class="resource-content flex-center flex-between">
				<input data-tooltip="{{localize "SPACE1889.NoEpCauseTempCampaingnEffect"}}" type="checkbox" name="system.noEpFirstLevel" {{checked system.noEpFirstLevel}} />
			</div>
			<div class="resource-content flex-center flex-between">
				<input type="text" name="system.noEpSource" value="{{system.noEpSource}}" />
			</div>
		</li>
	</div>

	<div>
		{{> "systems/space1889/templates/actor/parts/actor-effects.html"}}
	</div>

	{{> "systems/space1889/templates/item/parts/item-description.html"}}
</section>
