<div class="standard-form tab {{tabs.advanced.cssClass}}" 
		 data-tab="{{tabs.advanced.id}}" 
		 data-group="{{tabs.advanced.group}}">
	<div class="form-group">
		<label>{{ localize 'LIGHT.ColorationTechnique' }}</label>
		<div class="form-fields">
			<select name="system.coloration" data-dtype="Number">
				{{selectOptions system.lightShaderTechniques selected=system.coloration localize=true}}
			</select>
		</div>
		<p class="hint">{{ localize 'LIGHT.ColorationTechniqueHint' }}</p>
	</div>

	<div class="form-group">
		<label>{{ localize 'LIGHT.Luminosity' }}</label>
		<div class="form-fields">
			<range-picker name="system.luminosity" value={{system.luminosity}} min="-1" max="1" step="0.05"></range-picker>
		</div>
		<p class="hint">{{ localize 'LIGHT.LuminosityHint' }}</p>
	</div>

	<div class="form-group">
		<label>{{ localize 'LIGHT.Attenuation' }}</label>
		<div class="form-fields">
			<range-picker name="system.attenuation" value={{system.attenuation}} min="0" max="1" step="0.05"></range-picker>
		</div>
		<p class="hint">{{ localize 'LIGHT.AttenuationHint' }}</p>
	</div>

	<div class="form-group">
		<label>{{ localize 'LIGHT.Saturation' }}</label>
		<div class="form-fields">
			<range-picker name="system.saturation" value={{system.saturation}} min="-1" max="1" step="0.05"></range-picker>
		</div>
		<p class="hint">{{ localize 'LIGHT.SaturationHint' }}</p>
	</div>

	<div class="form-group">
		<label>{{ localize 'LIGHT.Contrast' }}</label>
		<div class="form-fields">
			<range-picker name="system.contrast" value={{system.contrast}} min="-1" max="1" step="0.05"></range-picker>
		</div>
		<p class="hint">{{ localize 'LIGHT.ContrastHint' }}</p>
	</div>

	<div class="form-group">
		<label>{{ localize 'LIGHT.Shadows' }}</label>
		<div class="form-fields">
			<range-picker name="system.shadows" value={{system.shadows}} min="0" max="1" step="0.05"></range-picker>
		</div>
		<p class="hint">{{ localize 'LIGHT.ShadowsHint' }}</p>
	</div>
</div>
