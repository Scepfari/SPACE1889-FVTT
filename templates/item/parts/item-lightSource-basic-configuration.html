<div class="standard-form tab {{tabs.basic.cssClass}}" 
		 data-tab="{{tabs.basic.id}}" 
		 data-group="{{tabs.basic.group}}">
	<div class="form-group slim">
		<label>{{localize "LIGHT.Radius"}} <span class="units">(m)</span></label>
		<div class="form-fields">
			<label for="lightDimRadius">{{localize "LIGHT.Dim"}}</label>
			<input type="number" name="system.dimRadius" id="lightDimRadius" value="{{system.dimRadius}}" step="any" />
			<label>{{localize "LIGHT.Bright"}}</label>
			<input type="number" name="system.brightRadius" value="{{system.brightRadius}}" step="any" />
		</div>
		<p class="hint">{{ localize 'LIGHT.RadiusHint' }}</p>
	</div>

	<div class="form-group slim">
		<label>{{localize "LIGHT.Angle" }} <span class="units">({{localize "Degrees"}})</span></label>
		<div class="form-fields">
			<label for="lightAngle">{{localize "Degrees"}}</label>
			<input type="number" name="system.angle" id="lightAngle" value="{{system.angle}}" placeholder="{{localize "Degrees"}}" />
		</div>
		<p class="hint">{{ localize 'LIGHT.AngleHint' }}</p>
	</div>

	<div class="form-group slim">
		<label>{{ localize "LIGHT.Color" }}</label>
		<div class="form-fields">
			<color-picker name="system.color" value="{{system.color}}"></color-picker>
		</div>
		<p class="hint">{{ localize 'LIGHT.ColorHint' }}</p>
	</div>

	<div class="form-group slim">
		<label>{{ localize "LIGHT.Alpha" }}</label>
		<div class="form-fields">
			<range-picker name="system.alpha" value={{system.alpha}} min="0" max="1" step="0.05"></range-picker>
		</div>
		<p class="hint">{{ localize 'LIGHT.ColorHint' }}</p>
	</div>
</div>
