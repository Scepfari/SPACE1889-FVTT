<div class="standard-form tab {{tabs.animation.cssClass}}" 
		 data-tab="{{tabs.animation.id}}" 
		 data-group="{{tabs.animation.group}}">
	<div class="form-group">
		<label>{{localize "LIGHT.AnimationType"}}</label>
		<div class="form-fields">
			<select name="system.animationType" data-dtype="String">
				{{selectOptions system.lightAnimations selected=system.animationType valueAttr="key" labelAttr="label"}}
			</select>
		</div>
	</div>

	<div class="form-group">
		<label>{{localize "LIGHT.AnimationSpeed"}}</label>
		<div class="form-fields">
			<range-picker name="system.animationSpeed" value={{system.animationSpeed}} min="0" max="10" step="1"></range-picker>
		</div>
		<p class="hint">{{ localize "LIGHT.AnimationSpeedHint" }}</p>
	</div>

	<div class="form-group">
		<label>{{localize "LIGHT.AnimationReverse"}}</label>
		<div class="form-fields">
			<input type="checkbox" name="system.reverseDirection" {{checked system.reverseDirection}} />
		</div>
	</div>

	<div class="form-group">
		<label for="animationIntensity">{{localize "LIGHT.AnimationIntensity"}}</label>
		<div class="form-fields">
			<range-picker id="animationIntensity" name="system.animationIntensity" value={{system.animationIntensity}} min="1" max="10" step="1"></range-picker>
		</div>
		<p class="hint">{{ localize "LIGHT.AnimationIntensityHint" }}</p>
	</div>
</div>
