<div class="standard-form tab {{tabs.advanced.cssClass}}" 
		 data-tab="{{tabs.advanced.id}}" 
		 data-group="{{tabs.advanced.group}}">
	<div class="form-group">
		<label>{{ localize "TOKEN.FIELDS.sight.color.label" }}</label>
		<div class="form-fields">
			<color-picker name="system.visionColor" value="{{system.visionColor}}"></color-picker>
		</div>
	</div>

	<div class="form-group">
		<label>{{ localize 'TOKEN.FIELDS.sight.attenuation.label' }}</label>
		<div class="form-fields">
			<range-picker name="system.visionAttenuation" value={{system.visionAttenuation}} min="0" max="1" step="0.05"></range-picker>
		</div>
		<p class="hint">{{ localize 'TOKEN.FIELDS.sight.attenuation.hint' }}</p>
	</div>

	<div class="form-group">
		<label>{{ localize 'TOKEN.FIELDS.sight.brightness.label' }}</label>
		<div class="form-fields">
			<range-picker name="system.visionBrightness" value={{system.visionBrightness}} min="-1" max="1" step="0.05"></range-picker>
		</div>
		<p class="hint">{{ localize 'TOKEN.FIELDS.sight.brightness.hint' }}</p>
	</div>

	<div class="form-group">
		<label>{{ localize 'TOKEN.FIELDS.sight.saturation.label' }}</label>
		<div class="form-fields">
			<range-picker name="system.visionSaturation" value={{system.visionSaturation}} min="-1" max="1" step="0.05"></range-picker>
		</div>
		<p class="hint">{{ localize 'TOKEN.FIELDS.sight.saturation.hint' }}</p>
	</div>

	<div class="form-group">
		<label>{{ localize 'TOKEN.FIELDS.sight.contrast.label' }}</label>
		<div class="form-fields">
			<range-picker name="system.visionContrast" value={{system.visionContrast}} min="-1" max="1" step="0.05"></range-picker>
		</div>
		<p class="hint">{{ localize 'TOKEN.FIELDS.sight.contrast.hint' }}</p>
	</div>
</div>
