<section class="{{cssClass}}" autocomplete="off">
	<li class="item flexrow items-header">
		<label class="resource-label">{{localize "SPACE1889.Caliber"}}</label>
		<label class="resource-label">{{localize "SPACE1889.AmmunitionType"}}</label>
		<label class="resource-label">{{localize "SPACE1889.CapacityType"}}</label>
		<label class="resource-label">{{localize "SPACE1889.Capacity"}}</label>
	</li>
	<li class="item flex-group-center flexrow">
		<div class="resource-content flex-center flex-between">
			<input type="text" name="system.caliber" value="{{system.caliber}}" />
		</div>
		<select name="system.type" system-dtype="String">
			{{selectOptions system.ammunitionTypes selected=system.type valueAttr="key" labelAttr="label"}}
		</select>
		<select name="system.capacityType" system-dtype="String">
			{{selectOptions system.capacityTypes selected=system.capacityType localize=true}}
		</select>
		<div class="resource-content flex-center flex-between">
			<input type="text" name="system.capacity" value="{{system.capacity}}" data-dtype="Number" />
		</div>
	</li>

	<li class="item flexrow items-header">
		<label class="resource-label" data-tooltip="{{ localize "SPACE1889.DamageType"}}">{{ localize "SPACE1889.DamageTypeAbbr"}}</label>
		<label class="resource-label" data-tooltip="{{ localize "SPACE1889.AmmunitionDamageModifier"}}">{{ localize "SPACE1889.AmmunitionDamageModifierAbbr"}}</label>
		<label class="resource-label" data-tooltip="{{ localize "SPACE1889.AmmunitionRangeModifierFactor"}}">{{ localize "SPACE1889.AmmunitionRangeModifierFactorAbbr"}}</label>
		<label class="resource-label" data-tooltip="{{ localize "SPACE1889.AmmunitionIsConeDamageEffect"}}">{{ localize "SPACE1889.AmmunitionIsConeDamageEffectAbbr"}}</label>
	</li>
	<li class="item flex-group-center flexrow">
		<div class="resource">
			<select name="system.damageType" data-dtype="String">
				{{selectOptions system.damageTypes selected=system.damageType localize=true}}
			</select>
		</div>
		<div class="resource">
			<input type="text" name="system.damageModifikator" value="{{system.damageModifikator}}" data-dtype="Number" />
		</div>
		<div class="resource">
			<input type="text" name="system.rangeModFactor" value="{{system.rangeModFactor}}" data-dtype="Number" />
		</div>
		<div class="resource-content flex-center flex-between">
			<input type="checkbox" name="system.isConeAttack" {{checked system.isConeAttack}} />
		</div>
	</li>


	<li class="item flexrow items-header">
		<label class="resource-label">{{localize "SPACE1889.Quantity"}}</label>
		<label class="resource-label">{{localize "SPACE1889.Weight"}}[kg]</label>
		<label class="resource-label">{{localize "SPACE1889.Price"}}</label>
		<label class="resource-label">{{localize "SPACE1889.StorageLocation"}}</label>
	</li>
	<li class="item flex-group-center flexrow">
		<div class="resource-content flex-center flex-between">
			<input type="text" name="system.quantity" value="{{system.quantity}}" data-dtype="Number" />
		</div>
		<div class="resource-content flex-center flex-between">
			<input type="number" min="0" step="0.001" name="system.weight" value="{{system.weight}}" data-dtype="Number" />
		</div>
		<div class="resource-content flex-center flex-between">
			<input type="text" name="system.price" value="{{system.price}}" />
		</div>
		<div class="resource-content flex-center flex-between">
			{{#if system.locationLong}}
			<label>{{system.locationLong}}</label>
			{{/if}}
		</div>
	</li>

	{{#if (ne derived.descriptionLangId (localize derived.descriptionLangId))}}
		<hr />
		<p>{{{localize derived.descriptionLangId}}}</p>
		<hr />
	{{/if}}

	{{> "systems/space1889/templates/item/parts/item-description.html"}}

</section>
